services:
  mongodb:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_DATABASE: inventory
    ports:
      - "27017:27017"
    volumes:
      - inventory-db:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'try { if (rs.status().myState !== 1) quit(1) } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"localhost:27017\"}]}); quit(1) }'"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  inventory-db:

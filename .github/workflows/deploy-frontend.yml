name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_GITHUB_PAGES: "true"
      VITE_API_URL: ${{ vars.VITE_API_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Validate backend API URL
        run: |
          node - <<'NODE'
          let apiUrl;
          try {
            apiUrl = new URL(process.env.VITE_API_URL);
          } catch {
            console.error("Set the Actions variable VITE_API_URL to the HTTPS origin of the deployed API, without /api.");
            process.exit(1);
          }
          if (apiUrl.protocol !== "https:" || apiUrl.pathname !== "/" || apiUrl.search || apiUrl.hash) {
            console.error("VITE_API_URL must be an HTTPS origin without a path, query, or fragment.");
            process.exit(1);
          }
          NODE
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html
        working-directory: frontend
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
